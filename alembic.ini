[alembic]
script_location = %(here)s/src/blah/db/migrations
prepend_sys_path = .
path_separator = os

# DB URL is set programmatically in env.py from BLAH_HOME
# This fallback is only used if env.py doesn't override it
sqlalchemy.url = sqlite:///%(here)s/blah.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
