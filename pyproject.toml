[project]
name = "blah"
version = "0.1.0"
description = "Social engagement agent. Makes noise so you don't have to."
readme = "README.md"
authors = [
    { name = "Mark Lubin", email = "mark@kairix.org" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "alembic>=1.18.3",
    "anthropic>=0.77.1",
]

[project.scripts]
blah = "blah.cli.main:cli"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=blah --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
